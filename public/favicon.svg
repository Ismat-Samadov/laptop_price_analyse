<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle with gradient -->
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#1a0a3a"/>
    </radialGradient>
    <linearGradient id="card1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#b91c1c"/>
    </linearGradient>
    <linearGradient id="card2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="card3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#15803d"/>
    </linearGradient>
    <linearGradient id="card4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)" stroke="#a855f7" stroke-width="1.5"/>

  <!-- Four colour quadrant cards fanned around centre -->
  <!-- Red card (top-left) -->
  <rect x="12" y="10" width="18" height="26" rx="3" fill="url(#card1)" transform="rotate(-15 21 23)" opacity="0.9"/>
  <!-- Blue card (top-right) -->
  <rect x="34" y="10" width="18" height="26" rx="3" fill="url(#card2)" transform="rotate(15 43 23)" opacity="0.9"/>
  <!-- Yellow card (bottom-left) -->
  <rect x="12" y="30" width="18" height="26" rx="3" fill="url(#card4)" transform="rotate(15 21 43)" opacity="0.85"/>
  <!-- Green card (bottom-right) -->
  <rect x="34" y="30" width="18" height="26" rx="3" fill="url(#card3)" transform="rotate(-15 43 43)" opacity="0.85"/>

  <!-- Centre UNO text oval -->
  <ellipse cx="32" cy="32" rx="14" ry="10" fill="#1a0a3a" stroke="white" stroke-width="1.2" opacity="0.95"/>
  <text x="32" y="36" text-anchor="middle" font-family="Arial Black, sans-serif" font-weight="900" font-size="10" fill="white" letter-spacing="0.5">UNO</text>
</svg>
